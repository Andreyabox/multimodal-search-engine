<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный поиск картинок</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>О приложении</h2>
            </div>
            <div class="sidebar-content">
                <p>Это приложение для поиска картинок по текстовому запросу</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Мультимодальный поиск картинок</h1>
            </header>

            <div class="tabs">
                <button class="tab-btn active" data-target="search-tab">Поиск картинок</button>
                <button class="tab-btn" data-target="upload-tab">Загрузка картинок</button>
            </div>

            <div class="tab-content active" id="search-tab">
                <div class="card search-card">
                    <form id="search-form">
                        <div class="form-group">
                            <label for="query">Введите запрос для поиска на английском языке</label>
                            <input type="text" id="query" value="car" required />
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="top_k">Количество результатов</label>
                                <input type="number" id="top_k" min="1" max="50" value="5" step="1" required />
                            </div>
                            <div class="form-group">
                                <label for="api_url" title="Например: /api или http://localhost:8000">API base URL</label>
                                <input type="text" id="api_url" value="/api" required />
                            </div>
                        </div>

                        <button type="submit" class="btn-primary" id="search-btn">
                            <span class="btn-text">Найти</span>
                            <span class="loader" style="display: none;"></span>
                        </button>
                    </form>
                </div>

                <div class="results-container">
                    <h3 id="results-title" style="display: none;">Результаты: <span id="results-query"></span></h3>
                    <div id="results-error" class="error-msg" style="display: none;"></div>
                    <div id="results-grid" class="image-grid"></div>
                    <div id="no-results" class="info-msg" style="display: none;">Ничего не найдено.</div>
                </div>
            </div>

            <div class="tab-content" id="upload-tab">
                <div class="card">
                    <h2>Загрузка картинок</h2>
                    <p>Загрузите ваши картинки для последующего поиска по ним.</p>
                    <div class="upload-area">
                        <p>Функция в разработке</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
