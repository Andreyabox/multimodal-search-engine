services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  store:
    build:
      context: ./store
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      - store
      - redis
    environment:
      DEBUG: "False"
      QDRANT_HOST: store
      QDRANT_PORT: "6333"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./data:/app/data:ro

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      - store
      - redis
    environment:
      QDRANT_HOST: store
      QDRANT_PORT: "6333"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./data:/app/data:ro

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui

volumes:
  qdrant_storage:
