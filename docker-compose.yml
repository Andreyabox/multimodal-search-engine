services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  store:
    build:
      context: ./store
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  encoders:
    build:
      context: .
      dockerfile: encoders/Dockerfile
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /opt/hf-cache
      TRANSFORMERS_CACHE: /opt/hf-cache
    volumes:
      - hf_cache:/opt/hf-cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      encoders:
        condition: service_healthy
      store:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DEBUG: "False"
      QDRANT_HOST: store
      QDRANT_PORT: "6333"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMBEDDER_HOST: encoders
      EMBEDDER_PORT: "8001"
    volumes:
      - ./data:/app/data:ro

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      encoders:
        condition: service_healthy
      store:
        condition: service_started
      redis:
        condition: service_started
    environment:
      QDRANT_HOST: store
      QDRANT_PORT: "6333"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMBEDDER_HOST: encoders
      EMBEDDER_PORT: "8001"
    volumes:
      - ./data:/app/data:ro

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui

volumes:
  qdrant_storage:
  hf_cache:
